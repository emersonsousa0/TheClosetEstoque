<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Produto - The Closet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <!-- MENU LATERAL -->

    <div class="sidebar">

        <h2>THE CLOSET</h2>

        <p class="menu-subtitle">GESTÃO DE ESTOQUE</p>

        <nav>

            <a href="/">🏠 Dashboard</a>

            <a href="/produtos">📦 Produtos</a>

            <a href="#">📥 Entradas</a>

            <a href="#">🛒 Vendas</a>

            <a href="#">📊 Estoque</a>

            <a href="/promocoes">🏷️ Promoções</a>

        </nav>

    </div>


    <!-- CONTEÚDO -->

    <div class="content">

        <h1>Novo Produto</h1>

        <p class="subtitle">
            Cadastre uma nova peça no estoque
        </p>


        <div class="form-container">


            <form method="POST" action="/produtos/novo">


                <!-- INFORMAÇÕES DO PRODUTO -->

                <h2 class="form-title">
                    Informações do produto
                </h2>


                <div class="form-row">


                    <div class="form-group">

                        <label for="nome">
                            Nome da peça
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Ex: Camiseta Básica"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="categoria">
                            Categoria
                        </label>

                        <select
                            id="categoria"
                            name="categoria"
                            required
                        >

                            <option value="">
                                Selecione uma categoria
                            </option>

                            <option value="Camiseta">
                                Camiseta
                            </option>

                            <option value="Blusa">
                                Blusa
                            </option>

                            <option value="Vestido">
                                Vestido
                            </option>

                            <option value="Calça">
                                Calça
                            </option>

                            <option value="Shorts">
                                Shorts
                            </option>

                            <option value="Saia">
                                Saia
                            </option>

                            <option value="Conjunto">
                                Conjunto
                            </option>

                            <option value="Jaqueta">
                                Jaqueta
                            </option>

                            <option value="Outra">
                                Outra
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label for="genero">
                            Público
                        </label>

                        <select
                            id="genero"
                            name="genero"
                            required
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="Feminino">
                                Feminino
                            </option>

                            <option value="Masculino">
                                Masculino
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="preco">
                            Preço
                        </label>

                        <input
                            type="number"
                            id="preco"
                            name="preco"
                            placeholder="0,00"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                </div>


                <!-- TAMANHOS -->

                <h2 class="form-title">
                    Quantidade por tamanho
                </h2>

                <p class="form-description">
                    Informe quantas unidades existem de cada tamanho.
                </p>


                <div class="sizes">


                    <div class="size-group">

                        <label for="tamanho_unico">
                            Único
                        </label>

                        <input
                            type="number"
                            id="tamanho_unico"
                            name="tamanho_unico"
                            value="0"
                            min="0"
                        >

                    </div>


                    <div class="size-group">

                        <label for="tamanho_p">
                            P
                        </label>

                        <input
                            type="number"
                            id="tamanho_p"
                            name="tamanho_p"
                            value="0"
                            min="0"
                        >

                    </div>


                    <div class="size-group">

                        <label for="tamanho_m">
                            M
                        </label>

                        <input
                            type="number"
                            id="tamanho_m"
                            name="tamanho_m"
                            value="0"
                            min="0"
                        >

                    </div>


                    <div class="size-group">

                        <label for="tamanho_g">
                            G
                        </label>

                        <input
                            type="number"
                            id="tamanho_g"
                            name="tamanho_g"
                            value="0"
                            min="0"
                        >

                    </div>


                    <div class="size-group">

                        <label for="tamanho_gg">
                            GG
                        </label>

                        <input
                            type="number"
                            id="tamanho_gg"
                            name="tamanho_gg"
                            value="0"
                            min="0"
                        >

                    </div>


                </div>


                <!-- BOTÕES -->

                <div class="form-actions">

                    <a href="/produtos" class="btn-cancel">
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn-save"
                    >
                        Cadastrar produto
                    </button>

                </div>


            </form>


        </div>


    </div>


</body>

</html>
