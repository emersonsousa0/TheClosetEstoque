<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Entrada - The Closet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="sidebar">

    <h2>THE CLOSET</h2>

    <p class="menu-subtitle">GESTÃO DE ESTOQUE</p>

    <nav>

        <a href="/">🏠 Dashboard</a>

        <a href="/produtos">📦 Produtos</a>

        <a href="/entradas">📥 Entradas</a>

        <a href="/vendas">🛒 Vendas</a>

        <a href="/estoque">📊 Estoque</a>

        <a href="/promocoes">🏷️ Promoções</a>

    </nav>

</div>


<div class="content">

    <h1>Registrar entrada</h1>

    <p class="subtitle">
        Adicione novas mercadorias ao estoque
    </p>


    <div class="form-card">

        <form method="POST" action="/entradas/nova">

            <!-- PRODUTO -->

            <div class="form-group">

                <label for="produto_id">
                    Produto
                </label>

                <select
                    name="produto_id"
                    id="produto_id"
                    required
                >

                    <option value="">
                        Selecione um produto
                    </option>

                    {% for produto in produtos %}

                        <option value="{{ produto.id }}">
                            {{ produto.nome }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- TAMANHOS -->

            <div class="form-group">

                <label>
                    Quantidade recebida por tamanho
                </label>

                <div class="entry-sizes">

                    <div class="entry-size">

                        <label for="tamanho_unico">
                            Único
                        </label>

                        <input
                            type="number"
                            name="tamanho_unico"
                            id="tamanho_unico"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="entry-size">

                        <label for="tamanho_p">
                            P
                        </label>

                        <input
                            type="number"
                            name="tamanho_p"
                            id="tamanho_p"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="entry-size">

                        <label for="tamanho_m">
                            M
                        </label>

                        <input
                            type="number"
                            name="tamanho_m"
                            id="tamanho_m"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="entry-size">

                        <label for="tamanho_g">
                            G
                        </label>

                        <input
                            type="number"
                            name="tamanho_g"
                            id="tamanho_g"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="entry-size">

                        <label for="tamanho_gg">
                            GG
                        </label>

                        <input
                            type="number"
                            name="tamanho_gg"
                            id="tamanho_gg"
                            min="0"
                            value="0"
                        >

                    </div>

                </div>

            </div>


            <!-- TOTAL -->

            <div class="entry-total">

                Total recebido:

                <strong id="totalEntrada">
                    0
                </strong>

                unidades

            </div>


            <!-- BOTÕES -->

            <div class="form-actions">

                <a
                    href="/entradas"
                    class="btn-cancel"
                >
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="btn-add"
                >
                    📥 Registrar entrada
                </button>

            </div>

        </form>

    </div>

</div>


<!-- CÁLCULO AUTOMÁTICO DO TOTAL -->

<script>

    const campos = [
        "tamanho_unico",
        "tamanho_p",
        "tamanho_m",
        "tamanho_g",
        "tamanho_gg"
    ];

    function atualizarTotal() {

        let total = 0;

        campos.forEach(function(campo) {

            const valor = document.getElementById(campo).value;

            total += Number(valor) || 0;

        });

        document.getElementById("totalEntrada").textContent = total;

    }


    campos.forEach(function(campo) {

        document.getElementById(campo).addEventListener(
            "input",
            atualizarTotal
        );

    });

</script>


</body>

</html>
